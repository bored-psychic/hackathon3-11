<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symptom Triage</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:flex;flex-direction:column;height:100dvh}
  header{padding:10px;background:#0b6;color:#fff;display:flex;justify-content:space-between;align-items:center}
  #chat{flex:1;overflow-y:auto;padding:12px;background:#f4f4f4}
  .b{max-width:80%;padding:8px 12px;margin:6px 0;border-radius:12px;white-space:pre-wrap}
  .user{background:#cfe9ff;margin-left:auto}.bot{background:#fff}
  .card{padding:12px;border-radius:12px;margin:8px 0;color:#fff}
  .RED{background:#d32f2f}.AMBER{background:#f9a825;color:#000}.GREEN{background:#2e7d32}
  form{display:flex;gap:6px;padding:8px;border-top:1px solid #ddd}
  input{flex:1;padding:10px;font-size:16px}
  footer{font-size:11px;padding:4px 8px;color:#555}
</style>
</head>
<body>
<header><b>Symptom Triage</b>
  <select id="lang"><option value="en">EN</option><option value="kn">ಕನ್ನಡ</option><option value="hi">हिन्दी</option></select>
</header>
<div id="chat"></div>
<form id="f"><input id="m" autocomplete="off" placeholder="Describe your symptoms"><button>Send</button></form>
<footer>Not medical advice. In an emergency call 108.</footer>
<script>
const chat=document.getElementById('chat'),m=document.getElementById('m'),lang=document.getElementById('lang');
let history=[];
function add(t,c){const d=document.createElement('div');d.className='b '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function card(o){const d=document.createElement('div');d.className='card '+o.level;
  d.innerHTML='<b>'+o.level+'</b><br>';
  [o.reason,o.advice].forEach(t=>{if(t){const p=document.createElement('div');p.textContent=t;d.appendChild(p)}});
  if(o.level!=='GREEN'){const a=document.createElement('a');a.href='tel:108';a.textContent='📞 Call 108';a.style.cssText='color:inherit;font-weight:bold;display:block;margin-top:8px';d.appendChild(a)}
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const msg=m.value.trim();if(!msg)return;m.value='';add(msg,'user');
  const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:msg,language:lang.value,history})});
  const o=await r.json();history.push({role:'user',text:msg});
  if(o.type==='final'){card(o)}else{add(o.reply||'...','bot');history.push({role:'bot',text:o.reply})}
};
</script>
</body>
</html>
