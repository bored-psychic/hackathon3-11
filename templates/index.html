<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7d4f">
<title>Health Check</title>
<style>
  /* ---------- Base ---------- */
  :root {
    --brand: #0a7d4f;
    --brand-dark: #075c3a;
    --bg: #eef3f0;
    --ink: #1b1f1d;
    --muted: #5b6560;
    --user: #d6ecff;
    --bot: #ffffff;
    --red: #c62828;
    --amber: #f9a825;
    --green: #2e7d32;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    /* System fonts only (no CDN). Indic fallbacks cover Android (Noto), Windows (Nirmala UI) and iOS. */
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
      "Noto Sans Kannada", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu",
      "Noto Sans Malayalam", "Nirmala UI", "Tunga", "Mangal", "Latha", "Gautami", "Kartika", sans-serif;
    font-size: 16px;
    line-height: 1.5; /* Indic scripts need extra line height */
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  button, select, input { font: inherit; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    padding-top: max(6px, env(safe-area-inset-top));
    background: var(--brand);
    color: #fff;
    flex-shrink: 0;
  }
  header h1 {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
    overflow-wrap: anywhere; /* long Indic titles wrap to 2 lines instead of being cut */
  }
  #lang {
    min-height: 44px;
    max-width: 120px;
    padding: 0 8px;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.18);
    color: #fff;
  }
  #lang option { color: var(--ink); background: #fff; }
  .sos {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 56px;
    min-height: 44px;
    padding: 0 10px;
    border-radius: 10px;
    background: #fff;
    color: var(--red);
    font-weight: 800;
    text-decoration: none;
  }

  /* ---------- Chat area ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .row { display: flex; margin: 8px 0; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    box-shadow: 0 1px 1px rgba(0,0,0,.06);
  }
  .user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .bot .bubble  { background: var(--bot);  border-bottom-left-radius: 4px; }
  .bubble.err   { background: #fff4e5; border: 1px solid #f0c27b; }

  /* "Listen" button under bot replies */
  .listen {
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 44px;
    margin-top: 4px;
    padding: 0 10px 0 6px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--brand-dark);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .listen[hidden] { display: none; }
  .listen svg { width: 20px; height: 20px; }

  /* Typing indicator */
  .typing .bubble { color: var(--muted); font-style: italic; }
  .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    margin-left: 3px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  /* ---------- Result card (full width) ---------- */
  .card {
    margin: 12px 0;
    padding: 16px;
    border-radius: var(--radius);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .card.RED   { background: var(--red); }
  .card.AMBER { background: var(--amber); color: #1b1300; }
  .card.GREEN { background: var(--green); }
  .card .level { font-size: 34px; font-weight: 800; line-height: 1.2; letter-spacing: .5px; }
  .card .meaning { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
  .card .label { font-size: 13px; font-weight: 700; text-transform: uppercase; opacity: .85; margin-top: 10px; }
  .card .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .card .listen { color: inherit; }
  .call {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 56px;
    margin-top: 14px;
    border-radius: 12px;
    background: #fff;
    color: var(--red);
    font-size: 20px;
    font-weight: 800;
    text-decoration: none;
  }
  .card.AMBER .call { background: #1b1300; color: #fff; }
  .call svg { width: 24px; height: 24px; }

  .newcheck {
    display: block;
    width: 100%;
    min-height: 48px;
    margin: 4px 0 12px;
    border: 2px solid var(--brand);
    border-radius: 12px;
    background: #fff;
    color: var(--brand-dark);
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Input bar ---------- */
  #note {
    min-height: 0;
    padding: 0 12px;
    font-size: 14px;
    color: var(--muted);
    flex-shrink: 0;
  }
  #note:not(:empty) { padding: 4px 12px; }
  form {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    background: #fff;
    border-top: 1px solid #d5ddd8;
    flex-shrink: 0;
  }
  #m {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    padding: 10px 14px;
    border: 1px solid #b9c4be;
    border-radius: 24px;
    font-size: 16px; /* >=16px stops iOS zoom-on-focus */
    background: #fff;
    color: var(--ink);
  }
  #m:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
  .iconbtn, #send {
    min-width: 48px;
    min-height: 48px;
    border: 0;
    border-radius: 24px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #e3efe9;
    color: var(--brand-dark);
  }
  .iconbtn svg { width: 24px; height: 24px; }
  .iconbtn.on { background: var(--red); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(198,40,40,.25); } }
  #send {
    padding: 0 16px;
    background: var(--brand);
    color: #fff;
    font-weight: 700;
  }
  button:disabled { opacity: .5; cursor: default; }

  footer {
    padding: 4px 12px;
    padding-bottom: max(4px, env(safe-area-inset-bottom));
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    background: #fff;
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .dots span, .iconbtn.on { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">Health Check</h1>
  <select id="lang" aria-label="Language">
    <option value="en">EN</option>
    <option value="kn" lang="kn">ಕನ್ನಡ</option>
    <option value="hi" lang="hi">हिन्दी</option>
    <option value="ta" lang="ta">தமிழ்</option>
    <option value="te" lang="te">తెలుగు</option>
    <option value="ml" lang="ml">മലയാളം</option>
  </select>
  <a class="sos" href="tel:108" aria-label="Call 108">108</a>
</header>

<main id="chat" aria-live="polite"></main>

<div id="note" role="status"></div>
<form id="f" autocomplete="off">
  <button type="button" id="mic" class="iconbtn" aria-label="Speak" hidden>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <input id="m" type="text" enterkeyhint="send" placeholder="Describe your symptoms">
  <button type="submit" id="send">Send</button>
</form>
<footer id="disclaimer">Not medical advice. In an emergency call 108.</footer>

      welcome: 'നമസ്കാരം! നിങ്ങൾക്കോ കുടുംബാംഗങ്ങൾക്കോ എന്ത് ആരോഗ്യപ്രശ്നമാണ് എന്ന് പറയൂ. ടൈപ്പ് ചെയ്യാം, അല്ലെങ്കിൽ മൈക്ക് അമർത്തി സംസാരിക്കാം.',
      typing: 'ടൈപ്പ് ചെയ്യുന്നു…',
      offline: 'ക്ഷമിക്കണം, കണക്റ്റ് ചെയ്യാനായില്ല. ഇന്റർനെറ്റ് പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക. അടിയന്തരമാണെങ്കിൽ 108 ൽ വിളിക്കുക.',
      call: '108 ൽ വിളിക്കുക', newCheck: 'പുതിയ പരിശോധന തുടങ്ങുക',
      why: 'കാരണം', todo: 'എന്ത് ചെയ്യണം', listen: 'കേൾക്കുക',
      speak: 'സംസാരിക്കുക', listening: 'കേൾക്കുന്നു… ഇപ്പോൾ സംസാരിക്കുക',
      micDenied: 'മൈക്ക് അനുമതി നിഷേധിച്ചു.', micNoSpeech: 'കേട്ടില്ല. വീണ്ടും ശ്രമിക്കുക.',
      RED: ['ചുവപ്പ്', 'അടിയന്തരം – ഉടൻ ആശുപത്രിയിൽ പോകുക'],
      AMBER: ['മഞ്ഞ', '24–48 മണിക്കൂറിനുള്ളിൽ ഡോക്ടറെയോ PHC യെയോ കാണുക'],
      GREEN: ['പച്ച', 'വീട്ടിൽ പരിചരണം – മോശമായാൽ ശ്രദ്ധിക്കുക']
    }
  };
  // Locale codes for speech recognition / synthesis.
  var SPEECH_LANG = { en: 'en-IN', kn: 'kn-IN', hi: 'hi-IN', ta: 'ta-IN', te: 'te-IN', ml: 'ml-IN' };
  var DEFAULT_LANG = 'kn'; // Karnataka default (see API.md)
  var REQUEST_TIMEOUT_MS = 40000; // backend LLM call can take ~25s

  var ICON_SPEAKER = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  var ICON_PHONE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1l-2.2 2.2z"/></svg>';

  /* ---------- DOM refs + state ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), form = $('f'), input = $('m'), sendBtn = $('send'),
      micBtn = $('mic'), langSel = $('lang'), note = $('note');
  var history = [];      // [{role:'user'|'bot', text}] sent with every request
  var busy = false;      // true while a /chat request is in flight
  var welcomeRow = null; // the welcome bubble, re-translated until the chat starts

  function lang() { return langSel.value; }
  function t(key) { return (T[lang()] || T.en)[key]; }

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // never innerHTML for server text
    return e;
  }

  /* ---------- Static UI translation ---------- */
  function applyLanguage() {
    var code = lang();
    document.documentElement.lang = code; // helps the browser pick the right script font
    document.title = t('title');
    $('title').textContent = t('title');
    langSel.setAttribute('aria-label', t('lang'));
    input.placeholder = t('placeholder');
    sendBtn.textContent = t('send');
    $('disclaimer').textContent = t('disclaimer');
    micBtn.setAttribute('aria-label', t('speak'));
    micBtn.title = t('speak');
    document.querySelector('.sos').setAttribute('aria-label', t('call'));
    // Re-translate the welcome message only if no conversation has started.
    if (welcomeRow && chat.children.length === 1) {
      chat.removeChild(welcomeRow);
      showWelcome();
    }
    try { localStorage.setItem('triage-lang', code); } catch (e) {}
  }

  /* ---------- Chat rendering ---------- */
  function addBubble(text, who, opts) {
    opts = opts || {};
    var row = el('div', 'row ' + who);
    var wrap = el('div');
    var b = el('div', 'bubble' + (opts.err ? ' err' : ''), text);
    b.lang = opts.lang || lang();
    wrap.appendChild(b);
    if (who === 'bot') wrap.appendChild(listenButton(text, b.lang));
    row.appendChild(wrap);
    chat.appendChild(row);
    scrollDown();
    return row;
  }

  function showWelcome() {
    welcomeRow = addBubble(t('welcome'), 'bot');
  }

  var typingRow = null;
  function showTyping(on) {
    if (on && !typingRow) {
      typingRow = el('div', 'row bot typing');
      var b = el('div', 'bubble', t('typing'));
      var dots = el('span', 'dots');
      dots.setAttribute('aria-hidden', 'true');
      dots.appendChild(el('span')); dots.appendChild(el('span')); dots.appendChild(el('span'));
      b.appendChild(dots);
      typingRow.appendChild(b);
      chat.appendChild(typingRow);
      scrollDown();
    } else if (!on && typingRow) {
      typingRow.remove();
      typingRow = null;
    }
  }

  // Full-width coloured result card for a "final" response.
  function showResult(o, replyLang) {
    var level = (o.level === 'RED' || o.level === 'AMBER' || o.level === 'GREEN') ? o.level : 'AMBER';
    var L = T[replyLang] || T.en;
    var card = el('section', 'card ' + level);
    card.lang = replyLang;
    card.appendChild(el('div', 'level', L[level][0]));
    card.appendChild(el('div', 'meaning', L[level][1]));

    // The hard-coded RED path sends identical reply/reason/advice; show each distinct text once.
    var reply = (o.reply || '').trim(), reason = (o.reason || '').trim(), advice = (o.advice || '').trim();
    if (reply && reply !== reason && reply !== advice) card.appendChild(el('div', 'text', reply));
    if (reason) {
      card.appendChild(el('div', 'label', L.why));
      card.appendChild(el('div', 'text', reason));
    }
    if (advice && advice !== reason) {
      card.appendChild(el('div', 'label', L.todo));
      card.appendChild(el('div', 'text', advice));
    }
    var spoken = [L[level][1], reply !== reason && reply !== advice ? reply : '', reason,
                  advice !== reason ? advice : ''].filter(Boolean).join('. ');
    card.appendChild(listenButton(spoken, replyLang));

    if (level !== 'GREEN') {
      var call = el('a', 'call');
      call.href = 'tel:108';
      call.innerHTML = ICON_PHONE; // static icon only
      call.appendChild(el('span', null, L.call));
      card.appendChild(call);
    }
    chat.appendChild(card);

    var again = el('button', 'newcheck', L.newCheck);
    again.type = 'button';
    again.addEventListener('click', resetChat);
    chat.appendChild(again);
    scrollDown();
  }

  function resetChat() {
    stopSpeaking();
    history = [];
    chat.textContent = '';
    showWelcome();
    input.focus();
  }

  /* ---------- Send a message to the backend ---------- */
  function setBusy(on) {
    busy = on;
    sendBtn.disabled = on;
    micBtn.disabled = on;
    showTyping(on);
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    var code = lang();
    input.value = '';
    note.textContent = '';
    addBubble(text, 'user', { lang: code });
    setBusy(true);

    var data = null;
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS) : null;
    try {
      var res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, language: code, history: history }),
        signal: ctrl ? ctrl.signal : undefined
      });
      data = await res.json();
    } catch (e) {
      data = null; // offline, timeout, or non-JSON server error
    }
    clearTimeout(timer);
    setBusy(false);

    if (!data || !data.type) {
      // Network failure: friendly message, keep the text so one tap on Send retries.
      addBubble(T[code].offline, 'bot', { err: true, lang: code });
      input.value = text;
      return;
    }

    if (data.type === 'final') {
      showResult(data, code);
      history = []; // conversation is over
    } else if (data.type === 'question') {
      addBubble(data.reply || '…', 'bot', { lang: code });
      history.push({ role: 'user', text: text });
      history.push({ role: 'bot', text: data.reply || '' });
    } else {
      // type "error" (or anything unexpected): show the reply as a bubble.
      addBubble(data.reply || T[code].offline, 'bot', { err: true, lang: code });
      history.push({ role: 'user', text: text });
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send(input.value);
  });

  langSel.addEventListener('change', function () {
    stopSpeaking();
    applyLanguage();
    refreshListenButtons();
  });

  /* ---------- Voice input (Web Speech API) ---------- */
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  if (Recognition) {
    micBtn.hidden = false;
    micBtn.addEventListener('click', function () {
      if (rec) { rec.stop(); return; } // second tap stops listening
      if (busy) return;
      stopSpeaking();
      try {
        rec = new Recognition();
      } catch (e) { micBtn.hidden = true; return; }
      rec.lang = SPEECH_LANG[lang()] || 'en-IN';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onstart = function () {
        micBtn.classList.add('on');
        note.textContent = t('listening');
      };
      rec.onresult = function (ev) {
        var said = ev.results[0][0].transcript;
        input.value = said;
        note.textContent = '';
        send(said);
      };
      rec.onerror = function (ev) {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') note.textContent = t('micDenied');
        else if (ev.error === 'no-speech' || ev.error === 'audio-capture') note.textContent = t('micNoSpeech');
        else if (ev.error !== 'aborted') note.textContent = t('micNoSpeech');
      };
      rec.onend = function () {
        micBtn.classList.remove('on');
        if (note.textContent === t('listening')) note.textContent = '';
        rec = null;
      };
      try { rec.start(); } catch (e) { rec = null; }
    });
  }

  /* ---------- "Listen" button (speechSynthesis) ---------- */
  var synth = window.speechSynthesis || null;

  // Best installed voice for a language code, or null if the device has none.
  function voiceFor(code) {
    if (!synth) return null;
    var want = (SPEECH_LANG[code] || 'en-IN').toLowerCase();
    var voices = synth.getVoices();
    var norm = function (v) { return (v.lang || '').replace('_', '-').toLowerCase(); };
    return voices.find(function (v) { return norm(v) === want; }) ||
           voices.find(function (v) { return norm(v).split('-')[0] === code; }) || null;
  }

  function listenButton(text, code) {
    var b = el('button', 'listen');
    b.type = 'button';
    b.innerHTML = ICON_SPEAKER; // static icon only
    b.appendChild(el('span', null, (T[code] || T.en).listen));
    b.dataset.lang = code;
    b.hidden = !voiceFor(code); // only offer it when the phone can speak this language
    b.addEventListener('click', function () {
      var v = voiceFor(code);
      if (!v) return;
      synth.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.voice = v;
      u.lang = v.lang;
      u.rate = 0.9; // a little slower is easier to follow
      synth.speak(u);
    });
    return b;
  }

  function refreshListenButtons() {
    document.querySelectorAll('.listen').forEach(function (b) {
      b.hidden = !voiceFor(b.dataset.lang);
    });
  }

  function stopSpeaking() { if (synth) synth.cancel(); }

  // Voices load asynchronously in Chrome.
  if (synth && 'onvoiceschanged' in synth) synth.addEventListener('voiceschanged', refreshListenButtons);

  /* ---------- Start ---------- */
  var saved = null;
  try { saved = localStorage.getItem('triage-lang'); } catch (e) {}
  langSel.value = T[saved] ? saved : DEFAULT_LANG;
  applyLanguage();
  showWelcome();
})();
</script>
</body>
</html>
