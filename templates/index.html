<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7d4f">
<meta name="description" content="Symptom check, family health records and nearby health centres for rural Karnataka.">
<title>Health Check</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=4">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <span class="logo" data-icon="cross"></span>
    <h1 id="title" data-i18n="appName">Health Check</h1>
    <select id="lang" data-i18n-aria="lang" aria-label="Language">
      <option value="en">EN</option>
      <option value="kn" lang="kn">ಕನ್ನಡ</option>
      <option value="hi" lang="hi">हिन्दी</option>
      <option value="ta" lang="ta">தமிழ்</option>
      <option value="te" lang="te">తెలుగు</option>
      <option value="ml" lang="ml">മലയാളം</option>
    </select>
    <a class="sos" href="tel:108" data-i18n-aria="call108" aria-label="Call 108">108</a>
  </div>
</header>

<main id="main">
  <!-- Dashboard: filled by renderHome() -->
  <section id="view-home" class="view" hidden></section>

  <!-- Symptom check chatbot -->
  <section id="view-check" class="view chatview" hidden>
    <div class="who">
      <label for="who" data-i18n="checkingFor">Checking for</label>
      <select id="who"></select>
    </div>
    <p id="shareNote" class="sharenote" data-i18n="shareNote" hidden></p>
    <div id="chat" aria-live="polite"></div>
    <div id="note" role="status"></div>
    <form id="f" autocomplete="off">
      <button type="button" id="mic" class="iconbtn" data-i18n-aria="speak" aria-label="Speak" hidden></button>
      <input id="m" type="text" enterkeyhint="send" data-i18n-ph="placeholder" placeholder="Describe the symptoms">
      <button type="submit" id="send" data-i18n="send">Send</button>
    </form>
    <p class="disclaimer" data-i18n="disclaimer">Not medical advice. In an emergency call 108.</p>
  </section>

  <!-- Nearby facilities: filled by renderNear() -->
  <section id="view-near" class="view" hidden></section>

  <!-- Family profiles: filled by renderFamily() -->
  <section id="view-family" class="view" hidden></section>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="#home" data-tab="home"><span class="ico" data-icon="home"></span><span data-i18n="navHome">Home</span></a>
  <a href="#check" data-tab="check"><span class="ico" data-icon="chat"></span><span data-i18n="navCheck">Check</span></a>
  <a href="#near" data-tab="near"><span class="ico" data-icon="pin"></span><span data-i18n="navNear">Nearby</span></a>
  <a href="#family" data-tab="family"><span class="ico" data-icon="people"></span><span data-i18n="navFamily">Family</span></a>
</nav>

<script src="{{ url_for('static', filename='i18n.js') }}?v=4"></script>
<script src="{{ url_for('static', filename='app.js') }}?v=4"></script>
</body>
</html>
